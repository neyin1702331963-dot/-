<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>存储探针预览</title><style>body{margin:0;background:#fbf3e9;font-family:system-ui,sans-serif}.wrap{max-width:560px;margin:0 auto;padding:16px}.note{background:#fff8f0;border:1px solid #e6c9a8;border-radius:10px;padding:10px 14px;color:#7a6450;font-size:13px;margin-bottom:8px}</style></head><body><div class="wrap"><div class="note"><b>浏览器存储探针 · 预览</b><br>浏览器里 4 个应全绿；刷新本页 A/B 的「累计运行」会+1。MMD 实测里看哪个绿、刷新后数字是否增长。</div><div class="content left"><img src='x' style='display:none' onerror="(function(e){var d=document.createElement('div');d.style.margin='6px';d.style.padding='8px';d.style.borderRadius='6px';d.style.fontSize='13px';d.style.background='#fff3cd';d.style.color='#856404';d.textContent='⧗ A localStorage：未执行';e.parentNode.insertBefore(d,e.nextSibling);try{localStorage.setItem('mmd_ls','ok');var v=localStorage.getItem('mmd_ls');if(v!=='ok')throw '读回不一致';var n=(parseInt(localStorage.getItem('mmd_ls_n'))||0)+1;localStorage.setItem('mmd_ls_n',n);d.textContent='✓ A localStorage 可用｜读回='+v+'｜累计运行='+n+' 次（刷新后应+1）';d.style.background='#e6f7e6';d.style.color='#1a7f1a'}catch(err){d.style.background='#fdeaea';d.style.color='#b00020';d.textContent='✗ A localStorage 不可用 → '+err}})(this)"><img src='x' style='display:none' onerror="(function(e){var d=document.createElement('div');d.style.margin='6px';d.style.padding='8px';d.style.borderRadius='6px';d.style.fontSize='13px';d.style.background='#fff3cd';d.style.color='#856404';d.textContent='⧗ B sessionStorage：未执行';e.parentNode.insertBefore(d,e.nextSibling);try{sessionStorage.setItem('mmd_ss','ok');var v=sessionStorage.getItem('mmd_ss');if(v!=='ok')throw '读回不一致';var n=(parseInt(sessionStorage.getItem('mmd_ss_n'))||0)+1;sessionStorage.setItem('mmd_ss_n',n);d.textContent='✓ B sessionStorage 可用｜累计运行='+n+' 次';d.style.background='#e6f7e6';d.style.color='#1a7f1a'}catch(err){d.style.background='#fdeaea';d.style.color='#b00020';d.textContent='✗ B sessionStorage 不可用 → '+err}})(this)"><img src='x' style='display:none' onerror="(function(e){var d=document.createElement('div');d.style.margin='6px';d.style.padding='8px';d.style.borderRadius='6px';d.style.fontSize='13px';d.style.background='#fff3cd';d.style.color='#856404';d.textContent='⧗ C cookie：未执行';e.parentNode.insertBefore(d,e.nextSibling);try{document.cookie='mmd_ck=ok;path=/';if(document.cookie.indexOf('mmd_ck=ok')===-1)throw 'cookie 未写入';d.textContent='✓ C cookie 可用｜cookie 串长='+document.cookie.length;d.style.background='#e6f7e6';d.style.color='#1a7f1a'}catch(err){d.style.background='#fdeaea';d.style.color='#b00020';d.textContent='✗ C cookie 不可用 → '+err}})(this)"><img src='x' style='display:none' onerror="(function(e){var d=document.createElement('div');d.style.margin='6px';d.style.padding='8px';d.style.borderRadius='6px';d.style.fontSize='13px';d.style.background='#fff3cd';d.style.color='#856404';d.textContent='⧗ D indexedDB：未执行';e.parentNode.insertBefore(d,e.nextSibling);try{if(!window.indexedDB)throw 'indexedDB 接口不存在';d.textContent='✓ D indexedDB 接口存在（异步库，可用于大数据缓存）';d.style.background='#e6f7e6';d.style.color='#1a7f1a'}catch(err){d.style.background='#fdeaea';d.style.color='#b00020';d.textContent='✗ D indexedDB 不可用 → '+err}})(this)"></div></div></body></html>
