<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>状态栏预览</title><style>.sb{max-width:360px;margin:12px 0;background:linear-gradient(145deg,#1f2430,#161a23);border:1px solid #3a4252;border-radius:12px;padding:14px;color:#e6e9ef;font-family:system-ui,sans-serif;font-size:13px;line-height:1.6}.sb-t{color:#7aa2f7;font-weight:bold;margin-bottom:10px;letter-spacing:2px}.sb-row{display:flex;padding:3px 0}.sb-l{width:46px;color:#7c8499;flex-shrink:0}.sb-v{color:#e6e9ef}.sb-favwrap{display:flex;justify-content:space-between;margin-top:10px}.sb-favnum{color:#f7768e;font-weight:bold}.sb-bar{height:6px;background:#2a3040;border-radius:3px;overflow:hidden;margin-top:5px}.sb-fill{height:100%;background:linear-gradient(90deg,#f7768e,#ff9e64);border-radius:3px}.sb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.sb-chip{background:#2a3040;border:1px solid #3a4252;border-radius:10px;padding:2px 9px;font-size:11px;color:#9aa5b8}</style><style>body{margin:0;background:#0d1117;font-family:system-ui;padding:18px;color:#c9d1d9}.note{max-width:420px;background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px;font-size:13px;line-height:1.7;margin-bottom:14px}.content{max-width:420px;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px}</style></head><body><div class="note">这是<b>预览功能</b>的产物：MMD 正则链已预跑一遍。<br>下面这个气泡里：正文 + 隐藏数据 span + 引擎 img。<br>浏览器加载时 img onerror 触发 → 引擎读隐藏数据 → 拼出状态栏。</div><div class="content"><p>她把拿铁推到你面前，杯壁的热气在窗玻璃上糊出一小片白。</p><span style="display:none">[时间=周六 下午 15:20]</span><span style="display:none">[地点=咖啡馆靠窗位]</span><span style="display:none">[心情=愉悦]</span><span style="display:none">[好感=68/100]</span><span style="display:none">[标签=放松,微醺,想聊天]</span><img src='x' style='display:none' onerror="(function(e){var b=e.closest('.content')||e.closest('.bubble')||e.parentNode;var reg=/\[([^=\[\]]+)=([^\[\]]+)\]/g;var d={},m;while((m=reg.exec(b.textContent))!==null){d[m[1].replace(/(^\s+)|(\s+$)/g,'')]=m[2].replace(/(^\s+)|(\s+$)/g,'')}var mk=function(c,t){var x=document.createElement('div');if(c)x.className=c;if(t)x.textContent=t;return x};var box=mk('sb','');box.appendChild(mk('sb-t','◆ 状态面板'));var row=function(l,v){if(!v)return;var r=mk('sb-row','');r.appendChild(mk('sb-l',l));r.appendChild(mk('sb-v',v));box.appendChild(r)};row('时间',d['时间']);row('地点',d['地点']);row('心情',d['心情']);var fav=d['好感'];if(fav){var fm=fav.match(/(\d+)\D+(\d+)/);if(fm){var w=mk('sb-favwrap','');w.appendChild(mk('sb-l','好感'));w.appendChild(mk('sb-favnum',fm[1]+'/'+fm[2]));box.appendChild(w);var bar=mk('sb-bar','');var fl=mk('sb-fill','');fl.style.width=Math.min(100,parseInt(fm[1])/parseInt(fm[2])/0.01)+'%';bar.appendChild(fl);box.appendChild(bar)}}if(d['标签']){var tg=mk('sb-tags','');var arr=d['标签'].split(/[,，]/);for(var i=0;i<arr.length;i++){var c=arr[i].replace(/(^\s+)|(\s+$)/g,'');if(c)tg.appendChild(mk('sb-chip',c))}box.appendChild(tg)}e.parentNode.insertBefore(box,e.nextSibling);e.remove()})(this)"></div></body></html>
