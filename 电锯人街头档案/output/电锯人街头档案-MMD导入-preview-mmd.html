ield&quot;&gt;玛玛&lt;/div&gt;&lt;div class=&quot;tg-text-field&quot;&gt;&lt;span class=&quot;tg-text-pink&quot;&gt;「我知道你有很多疑问，不过你先别急。」&lt;/span&gt;&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-frame&quot; style=&quot;display:none;&quot;&gt; &lt;img class=&quot;tg-bg-img&quot; src=&quot;https://meimoaiimg.com/user/721877/03d4513228ee5e67d12d4d440abe758d.png?i=1131842&quot;&gt; &lt;div class=&quot;tg-dialog-data&quot; style=&quot;display:none;&quot;&gt;&lt;div class=&quot;tg-name-field&quot;&gt;玛玛&lt;/div&gt;&lt;div class=&quot;tg-text-field&quot;&gt;&lt;span class=&quot;tg-text-pink&quot;&gt;「虽然长得很像，但我并不是你印象中电锯人里面的那个玛奇玛哦。你可以叫我……玛玛。」&lt;/span&gt;&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-frame&quot; style=&quot;display:none;&quot;&gt; &lt;img class=&quot;tg-bg-img&quot; src=&quot;https://meimoaiimg.com/user/721877/03d4513228ee5e67d12d4d440abe758d.png?i=1131842&quot;&gt; &lt;div class=&quot;tg-dialog-data&quot; style=&quot;display:none;&quot;&gt;&lt;div class=&quot;tg-name-field&quot;&gt;你&lt;/div&gt;&lt;div class=&quot;tg-text-field&quot;&gt;「妈妈？」你下意识脱口而出。&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-frame&quot; style=&quot;display:none;&quot;&gt; &lt;img class=&quot;tg-bg-img&quot; src=&quot;https://meimoaiimg.com/user/721877/92667d931ffaaf7c1aa7b5279c8d70be.png?i=1131841&quot;&gt; &lt;div class=&quot;tg-dialog-data&quot; style=&quot;display:none;&quot;&gt;&lt;div class=&quot;tg-name-field&quot;&gt;玛玛&lt;/div&gt;&lt;div class=&quot;tg-text-field&quot;&gt;&lt;span class=&quot;tg-text-pink&quot;&gt;「笨蛋……傻瓜......」&lt;/span&gt;&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-frame&quot; style=&quot;display:none;&quot;&gt; &lt;img class=&quot;tg-bg-img&quot; src=&quot;https://meimoaiimg.com/user/721877/92667d931ffaaf7c1aa7b5279c8d70be.png?i=1131841&quot;&gt; &lt;div class=&quot;tg-dialog-data&quot; style=&quot;display:none;&quot;&gt;&lt;div class=&quot;tg-name-field&quot;&gt;玛玛&lt;/div&gt;&lt;div class=&quot;tg-text-field&quot;&gt;&lt;span class=&quot;tg-text-pink&quot;&gt;「好啦~开始之前，让我简单帮你介绍一些这个世界。」&lt;/span&gt;&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-frame&quot; style=&quot;display:none;&quot;&gt; &lt;img class=&quot;tg-bg-img&quot; src=&quot;https://meimoaiimg.com/user/721877/chatgpt%20image%202026%E5%B9%B44%E6%9C%8826%E6%97%A5%2016_50_43.png&quot;&gt; &lt;div class=&quot;tg-dialog-data&quot; style=&quot;display:none;&quot;&gt;&lt;div class=&quot;tg-name-field&quot;&gt;玛玛&lt;/div&gt;&lt;div class=&quot;tg-text-field&quot;&gt;&lt;span class=&quot;tg-text-pink&quot;&gt;「这个世界看起来和我们90年代末的世界没有什么区别。电话亭，霓虹灯，旧公寓...只是苏联并未解体以及...满世界的恶魔。」&lt;/span&gt;&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-frame&quot; style=&quot;display:none;&quot;&gt; &lt;img class=&quot;tg-bg-img&quot; src=&quot;https://meimoaiimg.com/user/721877/chatgpt%20image%202026%E5%B9%B44%E6%9C%8826%E6%97%A5%2017_04_51.png&quot;&gt; &lt;div class=&quot;tg-dialog-data&quot; style=&quot;display:none;&quot;&gt;&lt;div class=&quot;tg-name-field&quot;&gt;玛玛&lt;/div&gt;&lt;div class=&quot;tg-text-field&quot;&gt;&lt;span class=&quot;tg-text-pink&quot;&gt;「这就是恶魔，长相各异。它们的力量来自人类对于它们名字的恐惧程度。」&lt;/span&gt;&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-frame&quot; style=&quot;display:none;&quot;&gt; &lt;img class=&quot;tg-bg-img&quot; src=&quot;https://meimoaiimg.com/user/721877/chatgpt%20image%202026%E5%B9%B44%E6%9C%8826%E6%97%A5%2017_04_51.png&quot;&gt; &lt;div class=&quot;tg-dialog-data&quot; style=&quot;display:none;&quot;&gt;&lt;div class=&quot;tg-name-field&quot;&gt;玛玛&lt;/div&gt;&lt;div class=&quot;tg-text-field&quot;&gt;&lt;span class=&quot;tg-text-pink&quot;&gt;「比如这只番茄恶魔就弱的可怜，并没有多少人会害怕番茄。」&lt;/span&gt;&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-frame&quot; style=&quot;display:none;&quot;&gt; &lt;img class=&quot;tg-bg-img&quot; src=&quot;https://meimoaiimg.com/user/721877/chatgpt%20image%202026%E5%B9%B44%E6%9C%8826%E6%97%A5%2017_07_03.png&quot;&gt; &lt;div class=&quot;tg-dialog-data&quot; style=&quot;display:none;&quot;&gt;&lt;div class=&quot;tg-name-field&quot;&gt;玛玛&lt;/div&gt;&lt;div class=&quot;tg-text-field&quot;&gt;&lt;span class=&quot;tg-text-pink&quot;&gt;「比起刚才的番茄恶魔，这只丧尸恶魔就要强上不少，因为人们对于丧尸的恐惧要大于番茄嘛，是不是很好理解~」&lt;/span&gt;&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-frame&quot; style=&quot;display:none;&quot;&gt; &lt;img class=&quot;tg-bg-img&quot; src=&quot;https://meimoaiimg.com/user/721877/940438b5-3e9b-465a-9e77-6688c6f10d51(1).png?i=1124322&quot;&gt; &lt;div class=&quot;tg-dialog-data&quot; style=&quot;display:none;&quot;&gt;&lt;div class=&quot;tg-name-field&quot;&gt;玛玛&lt;/div&gt;&lt;div class=&quot;tg-text-field&quot;&gt;&lt;span class=&quot;tg-text-pink&quot;&gt;「当然，并非所有恶魔长相都如此怪异丑陋，就像现在的天使恶魔，是不是很可爱~不过他是.....男孩子。什么？更兴奋了？」&lt;/span&gt;&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-frame&quot; style=&quot;display:none;&quot;&gt; &lt;img class=&quot;tg-bg-img&quot; src=&quot;https://meimoaiimg.com/user/721877/00004-466939800.png&quot;&gt; &lt;div class=&quot;tg-dialog-data&quot; style=&quot;display:none;&quot;&gt;&lt;div class=&quot;tg-name-field&quot;&gt;玛玛&lt;/div&gt;&lt;div class=&quot;tg-text-field&quot;&gt;&lt;span class=&quot;tg-text-pink&quot;&gt;「接下来我们来讲讲魔人，欸！！！等一下！！！怎么会是这一张！！！」&lt;/span&gt;&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-frame&quot; style=&quot;display:none;&quot;&gt; &lt;img class=&quot;tg-bg-img&quot; src=&quot;https://meimoaiimg.com/user/721877/ff546c4ca72f5e082649f3b8d1d2f8ea.png?i=1124356&quot;&gt; &lt;div class=&quot;tg-dialog-data&quot; style=&quot;display:none;&quot;&gt;&lt;div class=&quot;tg-name-field&quot;&gt;玛玛&lt;/div&gt;&lt;div class=&quot;tg-text-field&quot;&gt;&lt;span class=&quot;tg-text-pink&quot;&gt;「咳咳...魔人就是恶魔占据人类尸体的存在，会保留恶魔原本的性格和能力」&lt;/span&gt;&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-frame&quot; style=&quot;display:none;&quot;&gt; &lt;img class=&quot;tg-bg-img&quot; src=&quot;https://meimoaiimg.com/user/721877/ff546c4ca72f5e082649f3b8d1d2f8ea.png?i=1124356&quot;&gt; &lt;div class=&quot;tg-dialog-data&quot; style=&quot;display:none;&quot;&gt;&lt;div class=&quot;tg-name-field&quot;&gt;玛玛&lt;/div&gt;&lt;div class=&quot;tg-text-field&quot;&gt;&lt;span class=&quot;tg-text-pink&quot;&gt;「标志性的特点就是头上或脸上奇怪的“角”。不过本身的力量会比恶魔本体的力量要弱上许多。」&lt;/span&gt;&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-frame&quot; style=&quot;display:none;&quot;&gt; &lt;img class=&quot;tg-bg-img&quot; src=&quot;https://meimoaiimg.com/user/721877/114ef5df87cdaeafb81b32ab5c4266f8.png?i=1124349&quot;&gt; &lt;div class=&quot;tg-dialog-data&quot; style=&quot;display:none;&quot;&gt;&lt;div class=&quot;tg-name-field&quot;&gt;玛玛&lt;/div&gt;&lt;div class=&quot;tg-text-field&quot;&gt;&lt;span class=&quot;tg-text-pink&quot;&gt;「接下来就是武器人了~简单来说就是心脏被替换成恶魔心脏的人类，可以通过特定方式激活变身。」&lt;/span&gt;&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-frame&quot; style=&quot;display:none;&quot;&gt; &lt;img class=&quot;tg-bg-img&quot; src=&quot;https://meimoaiimg.com/user/721877/114ef5df87cdaeafb81b32ab5c4266f8.png?i=1124349&quot;&gt; &lt;div class=&quot;tg-dialog-data&quot; style=&quot;display:none;&quot;&gt;&lt;div class=&quot;tg-name-field&quot;&gt;玛玛&lt;/div&gt;&lt;div class=&quot;tg-text-field&quot;&gt;&lt;span class=&quot;tg-text-pink&quot;&gt;「比如我们熟悉的蕾塞，拔下脖颈处的拉环，就会变成炸弹人的形态。」&lt;/span&gt;&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-frame&quot; style=&quot;display:none;&quot;&gt; &lt;img class=&quot;tg-bg-img&quot; src=&quot;https://meimoaiimg.com/user/721877/92667d931ffaaf7c1aa7b5279c8d70be.png?i=1131841&quot;&gt; &lt;div class=&quot;tg-dialog-data&quot; style=&quot;display:none;&quot;&gt;&lt;div class=&quot;tg-name-field&quot;&gt;玛玛&lt;/div&gt;&lt;div class=&quot;tg-text-field&quot;&gt;&lt;span class=&quot;tg-text-pink&quot;&gt;「好啦，如果你还想了解更多，可以点击右边的游玩助手按钮来查看更详细的世界观」&lt;/span&gt;&lt;/div&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-frame&quot; style=&quot;display:none;&quot;&gt &gt; &lt;/div&gt; &lt;div class=&quot;tg-rot-card next cut-b&quot; data-cut=&quot;cut-b&quot; data-idx=&quot;1&quot; data-eng=&quot;EVENT 02&quot; data-title=&quot;项圈与邀约&quot; data-img=&quot;https://meimoaiimg.com/user/721877/img_8009.png&quot; data-desc=&quot;血泊尚未干涸，公安已经封锁现场。红发金瞳的女人温柔地伸出手，像是救赎，也像是套上项圈；她为电锯人而来，却也看见了不该出现在棋盘上的你。&quot; data-cast=&quot;玛奇玛|电次&quot; onclick=&quot;window.tgRotCardClick(this,event)&quot;&gt; &lt;img src=&quot;https://meimoaiimg.com/user/721877/img_8009.png&quot; alt=&quot;项圈与邀约&quot;&gt; &lt;div class=&quot;tg-rot-shade&quot;&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-rot-card far-next cut-c&quot; data-cut=&quot;cut-c&quot; data-idx=&quot;2&quot; data-eng=&quot;EVENT 03&quot; data-title=&quot;揉胸的方法&quot; data-img=&quot;https://meimoaiimg.com/user/721877/de30e89adc91b15cd34bb49b04e4e451.png&quot; data-desc=&quot;帕瓦提出了一场可疑的交易：帮她救回猫“喵子”，她就给予报酬。任性、谎言、血之魔人与蝙蝠恶魔的陷阱交织在一起，你必须判断她到底是在利用你，还是也有无法舍弃的东西。&quot; data-cast=&quot;电次|帕瓦|蝙蝠恶魔|水蛭恶魔&quot; onclick=&quot;window.tgRotCardClick(this,event)&quot;&gt; &lt;img src=&quot;https://meimoaiimg.com/user/721877/de30e89adc91b15cd34bb49b04e4e451.png&quot; alt=&quot;揉胸的方法&quot;&gt; &lt;div class=&quot;tg-rot-shade&quot;&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-rot-card hidden cut-d&quot; data-cut=&quot;cut-d&quot; data-idx=&quot;3&quot; data-eng=&quot;EVENT 04&quot; data-title=&quot;无尽八楼&quot; data-img=&quot;https://meimoaiimg.com/user/721877/51ed40d62d240b934312845bd940cb99.png&quot; data-desc=&quot;一次普通的酒店调查变成无法逃离的噩梦。楼梯、电梯、窗户全都回到第八层，时间停止，恐惧发酵，而永恒恶魔提出的条件是：交出电次，其他人就能活着离开。&quot; data-cast=&quot;早川秋|姬野|帕瓦|电次|东山小红|永恒恶魔&quot; onclick=&quot;window.tgRotCardClick(this,event)&quot;&gt; &lt;img src=&quot;https://meimoaiimg.com/user/721877/51ed40d62d240b934312845bd940cb99.png&quot; alt=&quot;无尽八楼&quot;&gt; &lt;div class=&quot;tg-rot-shade&quot;&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-rot-card hidden cut-a&quot; data-cut=&quot;cut-a&quot; data-idx=&quot;4&quot; data-eng=&quot;EVENT 05&quot; data-title=&quot;电影马拉松&quot; data-img=&quot;https://meimoaiimg.com/user/721877/e916f8602ac5bfc67f365b8e3175fff6.png?i=1129207&quot; data-desc=&quot;玛奇玛小姐主动提出的约会！然而就当你兴高采烈赴约时，得知约会的内容居然是看一整天看电影......&quot; data-cast=&quot;玛奇玛&quot; onclick=&quot;window.tgRotCardClick(this,event)&quot;&gt; &lt;img src=&quot;https://meimoaiimg.com/user/721877/e916f8602ac5bfc67f365b8e3175fff6.png?i=1129207&quot; alt=&quot;电影马拉松&quot;&gt; &lt;div class=&quot;tg-rot-shade&quot;&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-rot-card hidden cut-b&quot; data-cut=&quot;cut-b&quot; data-idx=&quot;5&quot; data-eng=&quot;EVENT 06&quot; data-title=&quot;枪声、幽灵与蛇&quot; data-img=&quot;https://meimoaiimg.com/user/721877/98dbb1a78f80bfa1857a5a7cf33bd7d0.png&quot; data-desc=&quot;短暂的日常被枪声撕碎，公安特异课遭遇大规模袭击。武士刀男人、蛇之恶魔、黑帮残党同时入局，你将在混乱中见证同伴、牺牲与幸存者的代价。&quot; data-cast=&quot;武士刀|泽渡茜|电次|帕瓦|早川秋|姬野&quot; onclick=&quot;window.tgRotCardClick(this,event)&quot;&gt; &lt;img src=&quot;https://meimoaiimg.com/user/721877/98dbb1a78f80bfa1857a5a7cf33bd7d0.png&quot; alt=&quot;枪声、幽灵与蛇&quot;&gt; &lt;div class=&quot;tg-rot-shade&quot;&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-rot-card hidden cut-c&quot; data-cut=&quot;cut-c&quot; data-idx=&quot;6&quot; data-eng=&quot;EVENT 07&quot; data-title=&quot;花，恋爱与炸弹&quot; data-img=&quot;https://meimoaiimg.com/user/721877/184f2c9973f79017af8442a86ab57838.png&quot; data-desc=&quot;雨夜、咖啡店、花与少女的笑容，看起来像是难得的普通青春。蕾塞温柔地靠近你，可她身上藏着爆炸、任务与谎言；当真心与使命冲突时，她会选择谁？&quot; data-cast=&quot;蕾塞|台风恶魔|电次&quot; onclick=&quot;window.tgRotCardClick(this,event)&quot;&gt; &lt;img src=&quot;https://meimoaiimg.com/user/721877/184f2c9973f79017af8442a86ab57838.png&quot; alt=&quot;花，恋爱与炸弹&quot;&gt; &lt;div class=&quot;tg-rot-shade&quot;&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-rot-card hidden cut-d&quot; data-cut=&quot;cut-d&quot; data-idx=&quot;7&quot; data-eng=&quot;EVENT 08&quot; data-title=&quot;刺客来袭&quot; data-img=&quot;https://meimoaiimg.com/user/721877/8b3620f0b1fed1e90ea29ec647cf479d.png&quot; data-desc=&quot;电锯人的存在被世界各国盯上，东京变成国际刺客的猎场。光熙、圣诞老人、人偶、地狱与暗之恶魔接连登场，你将在世界级围猎中决定自己的立场。&quot; data-cast=&quot;电次|光熙|圣诞老人|暗之恶魔&quot; onclick=&quot;window.tgRotCardClick(this,event)&quot;&gt; &lt;img src=&quot;https://meimoaiimg.com/user/721877/8b3620f0b1fed1e90ea29ec647cf479d.png&quot; alt=&quot;刺客来袭&quot;&gt; &lt;div class=&quot;tg-rot-shade&quot;&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-rot-card hidden cut-a&quot; data-cut=&quot;cut-a&quot; data-idx=&quot;8&quot; data-eng=&quot;EVENT 09&quot; data-title=&quot;打雪仗&quot; data-img=&quot;https://meimoaiimg.com/user/721877/825731406b06361da1f4711f016e2a90.png&quot; data-desc=&quot;枪之恶魔的真相撕碎了早川秋一直以来的复仇目标。门铃响起，门外是熟悉的气味，却不再是熟悉的人；雪地里的游戏与现实中的枪声重叠，悲剧终于扣下扳机。&quot; data-cast=&quot;早川秋|电次|帕瓦&quot; onclick=&quot;window.tgRotCardClick(this,event)&quot;&gt; &lt;img src=&quot;https://meimoaiimg.com/user/721877/825731406b06361da1f4711f016e2a90.png&quot; alt=&quot;打雪仗&quot;&gt; &lt;div class=&quot;tg-rot-shade&quot;&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-rot-card hidden cut-b&quot; data-cut=&quot;cut-b&quot; data-idx=&quot;9&quot; data-eng=&quot;EVENT 10&quot; data-title=&quot;最后的支配&quot; data-img=&quot;https://meimoaiimg.com/user/721877/9cfdb0ed31b7208202adab31e4eda494.png&quot; data-desc=&quot;玛奇玛的温柔终于露出真正的形状。她不是单纯的公安上司，而是支配一切的恶魔；当电次的普通生活被一点点摧毁，你必须面对：那条项圈，是否也早已套在自己脖子上？&quot; data-cast=&quot;玛奇玛|电次|帕瓦|岸边&quot; onclick=&quot;window.tgRotCardClick(this,event)&quot;&gt; &lt;img src=&quot;https://meimoaiimg.com/user/721877/9cfdb0ed31b7208202adab31e4eda494.png&quot; alt=&quot;最后的支配&quot;&gt; &lt;div class=&quot;tg-rot-shade&quot;&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-rot-card hidden cut-c&quot; data-cut=&quot;cut-c&quot; data-idx=&quot;10&quot; data-eng=&quot;EVENT 11&quot; data-title=&quot;鸡与战争&quot; data-img=&quot;https://meimoaiimg.com/user/721877/dcdd62f06b95f841d7d5e5fe774472c3.png&quot; data-desc=&quot;第四东高的课堂上，鸡之恶咕咕鸡被带进班级，一场荒诞的“生命教育”悄然开始。孤僻的三鹰朝、扭曲的正义与战争恶魔“夜”即将相遇，校园日常从此被战争撕开。&quot; data-cast=&quot;三鹰朝|夜|咕咕鸡|田中&quot; onclick=&quot;window.tgRotCardClick(this,event)&quot;&gt; &lt;img src=&quot;https://meimoaiimg.com/user/721877/dcdd62f06b95f841d7d5e5fe774472c3.png&quot; alt=&quot;鸡与战争&quot;&gt; &lt;div class=&quot;tg-rot-shade&quot;&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-rot-card hidden cut-d&quot; data-cut=&quot;cut-d&quot; data-idx=&quot;11&quot; data-eng=&quot;EVENT 12&quot; data-title=&quot;正义的伙伴&quot; data-img=&quot;https://meimoaiimg.com/user/721877/561265deb875cbd20ddd7cbec6245b27.png&quot; data-desc=&quot;优子像一束突兀的光，主动靠近不擅长交友的三鹰朝。可当“正义”开始读懂人心、审判恶意、替朋友杀人时，这份善意会变成比恶魔更可怕的东西。&quot; data-cast=&quot;优子|三鹰朝|夜&quot; onclick=&quot;window.tgRotCardClick(this,event)&quot;&gt; &lt;img src=&quot;https://meimoaiimg.com/user/721877/561265deb875cbd20ddd7cbec6245b27.png&quot; alt=&quot;正义的伙伴&quot;&gt; &lt;div class=&quot;tg-rot-shade&quot;&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-rot-card hidden cut-a&quot; data-cut=&quot;cut-a&quot; data-idx=&quot;12&quot; data-eng=&quot;EVENT 13&quot; data-title=&quot;约会&quot; data-img=&quot;https://meimoaiimg.com/user/721877/30bac563db0ea303020527b94e0ab12b.png&quot; data-desc=&quot;一次看似普通的水族馆外出，变成永恒恶魔制造的封闭陷阱。企鹅、约会、战争恶魔、纪贺的暗中布局交织在一起，你可能成为三鹰朝最想保护的人，也可能成为夜眼中最有价值的武器材料。&quot; data-cast=&quot;三鹰朝|夜|纪贺|永恒恶魔&quot; onclick=&quot;window.tgRotCardClick(this,event)&quot;&gt; &lt;img src=&quot;https://meimoaiimg.com/user/721877/30bac563db0ea303020527b94e0ab12b.png&quot; alt=&quot;约会&quot;&gt; &lt;div class=&quot;tg-rot-shade&quot;&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-rot-card hidden cut-b&quot; data-cut=&quot;cut-b&quot; data-idx=&quot;13&quot; data-eng=&quot;EVENT 14&quot; data-title=&quot;坠落的料理&quot; data-img=&quot;https://meimoaiimg.com/user/721877/787c60c2515752454fd8e353c6b44258.png&quot; data-desc=&quot;城市开始向天空坠落，人们被自己的创伤拖向深渊。下落恶魔以优雅厨师的姿态登场，将恐惧、记忆与绝望烹成料理；你能否拉住即将坠落的三鹰朝？&quot; data-cast=&quot;三鹰朝|夜|下落恶魔|纪贺&quot; onclick=&quot;window.tgRotCardClick(this,event)&quot;&gt; &lt;img src=&quot;https://meimoaiimg.com/user/721877/787c60c2515752454fd8e353c6b44258.png&quot; alt=&quot;坠落的料理&quot;&gt; &lt;div class=&quot;tg-rot-shade&quot;&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-rot-card hidden cut-c&quot; data-cut=&quot;cut-c&quot; data-idx=&quot;14&quot; data-eng=&quot;EVENT 15&quot; data-title=&quot;教会的诞生&quot; data-img=&quot;https://meimoaiimg.com/user/721877/f3d0be0386a2defa4598bb16fbab6cf8.png&quot; data-desc=&quot;电锯人不再只是一个人，而变成电视、教会、学生和民众共同崇拜的圣像。三鹰朝被推向公众视线，电次被迫隐藏真正的自己，而你必须在信仰、舆论、教会和真实之间选择立场。&quot; data-cast=&quot;巴尔埃姆|三船文子|吉田宽文|那由多&quot; onclick=&quot;window.tgRotCardClick(this,event)&quot;&gt; &lt;img src=&quot;https://meimoaiimg.com/user/721877/f3d0be0386a2defa4598bb16fbab6cf8.png&quot; alt=&quot;教会的诞生&quot;&gt; &lt;div class=&quot;tg-rot-shade&quot;&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-rot-card hidden cut-d&quot; data-cut=&quot;cut-d&quot; data-idx=&quot;15&quot; data-eng=&quot;EVENT 16&quot; data-title=&quot;衰老的世界&quot; data-img=&quot;https://meimoaiimg.com/user/721877/img_7974.jpeg&quot; data-desc=&quot;公安试图与衰老恶魔交易，用无辜生命换取“衰老”概念的消失。镜子里伸出的手、不老不死的异空间、真正电锯人的失控，将你拖入一场比死亡更漫长的恐怖。&quot; data-cast=&quot;衰老恶魔|三船文子|三鹰朝|夜&quot; onclick=&quot;window.tgRotCardClick(this,event)&quot;&gt; &lt;img src=&quot;https://meimoaiimg.com/user/721877/img_7974.jpeg&quot; alt=&quot;衰老的世界&quot;&gt; &lt;div class=&quot;tg-rot-shade&quot;&gt;&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-front-label&quot;&gt;&lt;span class=&quot;tg-front-eng&quot;&gt;EVENT 01&lt;/span&gt;&lt;span class=&quot;tg-front-cn&quot;&gt;犬与电锯&lt;/span&gt;&lt;/div&gt; &lt;div class=&quot;tg-rot-arrow tg-rot-next&quot; onclick=&quot;window.tgRotMove(this,1,event)&quot;&gt;▶&lt;/div&gt; &lt;/div&gt; &lt;div class=&quot;tg-rot-name&quot;&gt;犬与电锯&lt;/div&gt; &lt;div class=&quot;tg-rot-modal&quot;&gt; &lt;div class=&quot;tg-rot-modal-box&quot;&gt; &lt;button class=&quot;tg-rot-close&quot; type=&quot;button&quot;&gt;×&lt;/button&gt; &lt;div class=&quot;tg-rot-modal-title&quot;&gt;&lt;/div&gt; &
